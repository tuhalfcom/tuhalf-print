# Yeni sürüm yayınlama:
#   1) package.json içindeki "version" değerini artır (ör. 1.1.1) ve gönder
#   2) GitHub > Actions > "Derle ve yayınla" > Run workflow  (ya da: git tag v1.1.1 && git push --tags)
#   v<sürüm> etiketli Release kendiliğinden oluşturulur.
# Bu iş Windows kurulumunu derleyip GitHub Releases'a yükler (Mac .dmg, Actions çıktısı olarak iner).
# Ofisteki bilgisayarlar yeni sürümü kendiliğinden görür.
name: Derle ve yayınla

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Derle ve yayınla
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Tuhalf-Print-Windows
          path: |
            dist/*.exe
            dist/latest.yml

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Derle ve yayınla
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Tuhalf-Print-Mac
          path: dist/*.dmg
